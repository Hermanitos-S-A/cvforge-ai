name: ePersona Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pip-audit
      - name: Python tests
        run: python -m pytest backend/tests -q
      - name: Python dependency audit (no suppressions)
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend quality and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Node dependency audit (no suppressions)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning with Gitleaks CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full Git history (print metadata only, never secret values)
        env:
          REPORT_DIR: ${{ runner.temp }}/epersona-gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --volume "$REPORT_DIR:/report" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --exit-code 1 --config /repo/.gitleaks.toml \
              --report-format json --report-path /report/findings.json /repo
          scan_status=$?
          set -e
          if [ -s "$REPORT_DIR/findings.json" ]; then
            python - "$REPORT_DIR/findings.json" <<'PYREPORT'
          import json
          import sys
          from pathlib import Path
          findings = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"Gitleaks findings: {len(findings)}")
          for item in findings:
              path = item.get("File", "unknown")
              line = item.get("StartLine", "?")
              rule = item.get("RuleID", "unknown")
              commit = str(item.get("Commit", ""))[:12]
              print(f"file={path} line={line} rule={rule} commit={commit}")
          PYREPORT
          fi
          exit "$scan_status"
