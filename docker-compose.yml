services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvforge-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/cvforge.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-this-in-production-32chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - DEBUG=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Stripe v1.4
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_test}
      - STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY:-price_monthly_placeholder}
      - STRIPE_PRICE_YEARLY=${STRIPE_PRICE_YEARLY:-price_yearly_placeholder}
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvforge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: cvforge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
